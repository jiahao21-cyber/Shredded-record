<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>净重减脂记录器 Pro</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- 配置 Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617' },
                        // Custom Nutrient Colors
                        protein: '#f43f5e', // Rose
                        carbs: '#8b5cf6',   // Violet
                        fat: '#f59e0b',     // Amber
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #020617;
            background-image: radial-gradient(ellipse at top, rgba(88, 28, 135, 0.3), #020617, #000000);
            color: #e2e8f0;
            min-height: 100vh;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        /* Glass Effect Helper */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
        }

        /* Progress Bar Animation */
        .progress-bar-fill {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Icons ---
        const IconScale = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>;
        const IconTrendingDown = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
        const IconCalendar = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
        const IconTrash2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
        const IconSettings = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
        const IconAlert = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const IconUtensils = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>;
        const IconCheck = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;

        // --- Chart Component ---
        const ChartView = ({ data, chartView }) => {
            const chartRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || typeof Chart === 'undefined') return;

                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                const labels = data.map(d => d.name);
                const values = data.map(d => d.value);

                const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, 'rgba(244, 63, 94, 0.5)'); 
                gradient.addColorStop(1, 'rgba(244, 63, 94, 0.0)');

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '净体重 (KG)',
                            data: values,
                            borderColor: '#f43f5e',
                            backgroundColor: gradient,
                            borderWidth: 3,
                            pointBackgroundColor: '#f43f5e',
                            pointBorderColor: '#fff',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(51, 65, 85, 0.3)', drawBorder: false }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: 'rgba(51, 65, 85, 0.3)', drawBorder: false }, ticks: { color: '#94a3b8' }, suggestedMin: Math.min(...values) - 0.5, suggestedMax: Math.max(...values) + 0.5 }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <div style={{ height: '250px', width: '100%' }}><canvas ref={canvasRef}></canvas></div>;
        };

        // --- Nutrient Progress Bar Component ---
        const MacroBar = ({ label, current, goal, colorClass, unit = 'g' }) => {
            const percentage = Math.min(100, (current / goal) * 100);
            const isOver = current > goal;
            
            // Dynamic Color Logic
            let barColor = colorClass; // default (Tailwind class handling usually, but here we use inline or map)
            let textColor = "text-slate-400";
            
            // Map props to colors
            const colorMap = {
                "protein": "bg-rose-500",
                "carbs": "bg-violet-500",
                "fat": "bg-amber-500",
                "over": "bg-red-600 animate-pulse"
            };
            
            const activeColor = isOver ? colorMap.over : colorMap[label];

            return (
                <div className="mb-4 group">
                    <div className="flex justify-between text-xs mb-1 font-medium tracking-wide">
                        <span className={`uppercase ${isOver ? 'text-red-400 font-bold' : 'text-slate-300'}`}>
                            {label === 'protein' ? '蛋白质 (Protein)' : label === 'carbs' ? '碳水 (Carbs)' : '脂肪 (Fat)'}
                        </span>
                        <span className={isOver ? 'text-red-400' : 'text-slate-400'}>
                            {current} / {goal} {unit}
                            {isOver && <IconAlert className="inline w-3 h-3 ml-1" />}
                        </span>
                    </div>
                    <div className="h-2.5 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5">
                        <div 
                            className={`h-full rounded-full progress-bar-fill shadow-[0_0_10px_rgba(0,0,0,0.5)] ${activeColor}`} 
                            style={{ width: `${percentage}%` }}
                        ></div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            // State: Weight Records
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('weightRecords');
                return saved ? JSON.parse(saved) : [];
            });

            // State: Food Logs (New)
            // Structure: { "2023-10-27": [{id: 1, name: "Egg", p: 6, c: 1, f: 5}, ...] }
            const [foodLogs, setFoodLogs] = useState(() => {
                const saved = localStorage.getItem('foodLogs');
                return saved ? JSON.parse(saved) : {};
            });

            // State: Macro Goals
            const [goals, setGoals] = useState(() => {
                const saved = localStorage.getItem('macroGoals');
                return saved ? JSON.parse(saved) : { protein: 150, carbs: 200, fat: 60 };
            });

            const [inputs, setInputs] = useState({
                wake: '', postFood: '', postToilet: '',
                date: new Date().toISOString().split('T')[0]
            });

            const [newFood, setNewFood] = useState({ name: '', p: '', c: '', f: '' });
            const [showSettings, setShowSettings] = useState(false);
            const [chartView, setChartView] = useState('daily');

            // Persistence
            useEffect(() => localStorage.setItem('weightRecords', JSON.stringify(records)), [records]);
            useEffect(() => localStorage.setItem('foodLogs', JSON.stringify(foodLogs)), [foodLogs]);
            useEffect(() => localStorage.setItem('macroGoals', JSON.stringify(goals)), [goals]);

            // --- Handlers: Weight ---
            const handleInputChange = (e) => setInputs(prev => ({ ...prev, [e.target.name]: e.target.value }));
            
            const handleAddRecord = (e) => {
                e.preventDefault();
                if (!inputs.wake || !inputs.postFood || !inputs.postToilet) return;
                const wake = parseFloat(inputs.wake);
                const postFood = parseFloat(inputs.postFood);
                const postToilet = parseFloat(inputs.postToilet);
                const waste = parseFloat((postFood - postToilet).toFixed(2));
                const trueWeight = parseFloat((wake - waste).toFixed(2));
                
                const newRecord = { id: Date.now(), date: inputs.date, wake, postFood, postToilet, waste, net: trueWeight };
                const otherRecords = records.filter(r => r.date !== inputs.date);
                setRecords([...otherRecords, newRecord].sort((a, b) => new Date(a.date) - new Date(b.date)));
                setInputs(prev => ({ ...prev, wake: '', postFood: '', postToilet: '' }));
            };

            const handleDeleteRecord = (id) => {
                if (window.confirm('确定删除此体重记录？')) setRecords(records.filter(r => r.id !== id));
            };

            // --- Handlers: Food ---
            const handleFoodChange = (e) => setNewFood(prev => ({ ...prev, [e.target.name]: e.target.value }));

            const handleAddFood = (e) => {
                e.preventDefault();
                if (!newFood.name) return;

                const p = parseFloat(newFood.p) || 0;
                const c = parseFloat(newFood.c) || 0;
                const f = parseFloat(newFood.f) || 0;

                const entry = { id: Date.now(), name: newFood.name, p, c, f };
                
                setFoodLogs(prev => {
                    const currentDayLogs = prev[inputs.date] || [];
                    return { ...prev, [inputs.date]: [...currentDayLogs, entry] };
                });
                
                setNewFood({ name: '', p: '', c: '', f: '' });
            };

            const handleDeleteFood = (id) => {
                setFoodLogs(prev => ({
                    ...prev,
                    [inputs.date]: prev[inputs.date].filter(item => item.id !== id)
                }));
            };

            const handleSaveGoals = (e) => {
                e.preventDefault();
                setShowSettings(false);
            };

            // --- Calculations ---
            const todaysMacros = useMemo(() => {
                const logs = foodLogs[inputs.date] || [];
                return logs.reduce((acc, item) => ({
                    p: acc.p + item.p,
                    c: acc.c + item.c,
                    f: acc.f + item.f
                }), { p: 0, c: 0, f: 0 });
            }, [foodLogs, inputs.date]);

            const stats = useMemo(() => {
                if (records.length === 0) return { totalLost: 0, currentWeekAvg: 0, latestWeight: 0 };
                const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
                const latest = sorted[sorted.length - 1];
                const first = sorted[0];
                const totalLost = (first.net - latest.net).toFixed(2);
                
                const lastDate = new Date(latest.date);
                const weekAgo = new Date(lastDate);
                weekAgo.setDate(lastDate.getDate() - 6);
                const weekRecords = sorted.filter(r => new Date(r.date) >= weekAgo && new Date(r.date) <= lastDate);
                const weekSum = weekRecords.reduce((acc, curr) => acc + curr.net, 0);
                const currentWeekAvg = weekRecords.length ? (weekSum / weekRecords.length).toFixed(2) : 0;
                return { totalLost, currentWeekAvg, latestWeight: latest.net };
            }, [records]);

            const chartData = useMemo(() => {
                if (records.length === 0) return [];
                const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
                if (chartView === 'daily') return sorted.map(r => ({ name: r.date.slice(5), value: r.net }));
                // Simplified weekly/monthly logic for brevity
                return sorted.map(r => ({ name: r.date.slice(5), value: r.net }));
            }, [records, chartView]);

            return (
                <div className="max-w-md mx-auto pb-10">
                    
                    {/* Header */}
                    <header className="bg-gradient-to-br from-rose-800 via-purple-900 to-slate-900 text-white p-6 shadow-2xl shadow-purple-900/20 rounded-b-3xl mb-6 relative overflow-hidden">
                        <div className="absolute -top-10 -right-10 w-40 h-40 bg-rose-500/20 rounded-full blur-3xl"></div>
                        <div className="relative z-10">
                            <h1 className="text-2xl font-bold flex items-center gap-2">
                                <IconScale className="w-8 h-8 text-rose-200" />
                                <span className="bg-clip-text text-transparent bg-gradient-to-r from-white to-rose-100">
                                    净重减脂 Pro
                                </span>
                            </h1>
                            <p className="opacity-70 text-sm mt-1 text-rose-100/60">Eat clean, Train hard.</p>
                            
                            <div className="grid grid-cols-3 gap-3 mt-6">
                                <div className="bg-black/20 border border-white/10 p-3 rounded-xl text-center backdrop-blur-sm">
                                    <div className="text-xs text-rose-200/70 mb-1">当前净重</div>
                                    <div className="text-xl font-bold">{stats.latestWeight || '--'} <span className="text-xs opacity-50">kg</span></div>
                                </div>
                                <div className="bg-black/20 border border-white/10 p-3 rounded-xl text-center backdrop-blur-sm">
                                    <div className="text-xs text-rose-200/70 mb-1">已减去</div>
                                    <div className="text-xl font-bold text-rose-400">{stats.totalLost > 0 ? `-${stats.totalLost}` : stats.totalLost}</div>
                                </div>
                                <div className="bg-black/20 border border-white/10 p-3 rounded-xl text-center backdrop-blur-sm">
                                    <div className="text-xs text-rose-200/70 mb-1">7日平均</div>
                                    <div className="text-xl font-bold text-purple-300">{stats.currentWeekAvg || '--'}</div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="px-4 space-y-6">
                        
                        {/* Global Date Picker */}
                        <div className="flex justify-between items-center bg-slate-900/40 p-3 rounded-xl border border-white/5">
                            <span className="text-sm text-slate-400 font-medium ml-1">选择日期:</span>
                            <input 
                                type="date" 
                                name="date"
                                value={inputs.date}
                                onChange={handleInputChange}
                                className="bg-black/40 border border-slate-700 rounded-lg p-1.5 text-sm text-white outline-none focus:border-rose-500"
                                style={{colorScheme: 'dark'}}
                            />
                        </div>

                        {/* --- NEW: Macro Tracker Section --- */}
                        <section className="glass-panel p-5 rounded-2xl relative">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-semibold flex items-center gap-2 text-white">
                                    <IconUtensils className="w-5 h-5 text-violet-400" />
                                    营养摄入
                                </h2>
                                <button onClick={() => setShowSettings(!showSettings)} className="text-slate-400 hover:text-white transition-colors">
                                    <IconSettings className="w-5 h-5" />
                                </button>
                            </div>

                            {/* Settings Modal (Inline) */}
                            {showSettings && (
                                <div className="mb-6 bg-slate-800/80 p-4 rounded-xl border border-rose-500/30 animate-pulse-slow">
                                    <h3 className="text-xs font-bold text-rose-300 uppercase mb-3 tracking-wider">设置每日目标 (g)</h3>
                                    <div className="grid grid-cols-3 gap-2 mb-3">
                                        <div>
                                            <label className="text-[10px] text-slate-400 block mb-1">蛋白质</label>
                                            <input type="number" value={goals.protein} onChange={(e) => setGoals({...goals, protein: parseFloat(e.target.value)})} className="w-full bg-black/50 border border-slate-600 rounded p-1 text-center text-rose-400 font-bold"/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-slate-400 block mb-1">碳水</label>
                                            <input type="number" value={goals.carbs} onChange={(e) => setGoals({...goals, carbs: parseFloat(e.target.value)})} className="w-full bg-black/50 border border-slate-600 rounded p-1 text-center text-violet-400 font-bold"/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-slate-400 block mb-1">脂肪</label>
                                            <input type="number" value={goals.fat} onChange={(e) => setGoals({...goals, fat: parseFloat(e.target.value)})} className="w-full bg-black/50 border border-slate-600 rounded p-1 text-center text-amber-400 font-bold"/>
                                        </div>
                                    </div>
                                    <button onClick={handleSaveGoals} className="w-full bg-rose-600/80 hover:bg-rose-500 text-white text-xs py-2 rounded-lg font-bold flex items-center justify-center gap-1">
                                        <IconCheck className="w-3 h-3" /> 保存设置
                                    </button>
                                </div>
                            )}

                            {/* Progress Bars */}
                            <MacroBar label="protein" current={todaysMacros.p} goal={goals.protein} colorClass="protein" />
                            <MacroBar label="carbs" current={todaysMacros.c} goal={goals.carbs} colorClass="carbs" />
                            <MacroBar label="fat" current={todaysMacros.f} goal={goals.fat} colorClass="fat" />

                            {/* Add Food Form */}
                            <div className="mt-6 pt-4 border-t border-white/5">
                                <form onSubmit={handleAddFood} className="flex flex-col gap-2">
                                    <input 
                                        type="text" name="name" placeholder="食物名称 (如: 鸡胸肉)" 
                                        value={newFood.name} onChange={handleFoodChange}
                                        className="w-full bg-black/30 border border-slate-700 rounded-lg p-2 text-sm text-white placeholder-slate-500 focus:border-violet-500 outline-none"
                                    />
                                    <div className="grid grid-cols-4 gap-2">
                                        <input type="number" name="p" placeholder="蛋(g)" value={newFood.p} onChange={handleFoodChange} className="bg-black/30 border border-slate-700 rounded-lg p-2 text-sm text-center text-rose-300 placeholder-rose-900/50 focus:border-rose-500 outline-none"/>
                                        <input type="number" name="c" placeholder="碳(g)" value={newFood.c} onChange={handleFoodChange} className="bg-black/30 border border-slate-700 rounded-lg p-2 text-sm text-center text-violet-300 placeholder-violet-900/50 focus:border-violet-500 outline-none"/>
                                        <input type="number" name="f" placeholder="脂(g)" value={newFood.f} onChange={handleFoodChange} className="bg-black/30 border border-slate-700 rounded-lg p-2 text-sm text-center text-amber-300 placeholder-amber-900/50 focus:border-amber-500 outline-none"/>
                                        <button type="submit" className="bg-violet-600 hover:bg-violet-500 text-white rounded-lg font-bold text-lg flex items-center justify-center shadow-lg shadow-violet-900/20">+</button>
                                    </div>
                                </form>

                                {/* Food List */}
                                <div className="mt-4 space-y-2 max-h-40 overflow-y-auto pr-1">
                                    {(foodLogs[inputs.date] || []).map(item => (
                                        <div key={item.id} className="flex justify-between items-center text-xs bg-white/5 p-2 rounded-lg border border-white/5 group hover:bg-white/10 transition-colors">
                                            <span className="font-medium text-slate-300">{item.name}</span>
                                            <div className="flex items-center gap-3">
                                                <div className="flex gap-2 opacity-80 font-mono">
                                                    <span className="text-rose-400">P:{item.p}</span>
                                                    <span className="text-violet-400">C:{item.c}</span>
                                                    <span className="text-amber-400">F:{item.f}</span>
                                                </div>
                                                <button onClick={() => handleDeleteFood(item.id)} className="text-slate-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <IconTrash2 className="w-3.5 h-3.5" />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                    {(!foodLogs[inputs.date] || foodLogs[inputs.date].length === 0) && (
                                        <div className="text-center text-slate-600 text-xs py-2 italic">暂无今日饮食记录</div>
                                    )}
                                </div>
                            </div>
                        </section>

                        {/* Weight Input Form */}
                        <section className="glass-panel p-5 rounded-2xl">
                            <h2 className="text-lg font-semibold mb-4 flex items-center gap-2 text-white">
                                <IconScale className="w-5 h-5 text-rose-500" />
                                净重计算
                            </h2>
                            <form onSubmit={handleAddRecord} className="space-y-4">
                                <div className="grid grid-cols-3 gap-3">
                                    <div>
                                        <label className="text-[10px] text-slate-400 uppercase tracking-wider mb-1 block">① 起床</label>
                                        <input 
                                            type="number" step="0.01" placeholder="00.0" name="wake"
                                            value={inputs.wake} onChange={handleInputChange} 
                                            className="w-full bg-black/40 border border-slate-700 rounded-lg p-2 text-sm text-center text-white outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder-slate-700 font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 uppercase tracking-wider mb-1 block">② 饭后</label>
                                        <input 
                                            type="number" step="0.01" placeholder="00.0" name="postFood"
                                            value={inputs.postFood} onChange={handleInputChange} 
                                            className="w-full bg-black/40 border border-slate-700 rounded-lg p-2 text-sm text-center text-white outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder-slate-700 font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 uppercase tracking-wider mb-1 block">③ 厕后</label>
                                        <input 
                                            type="number" step="0.01" placeholder="00.0" name="postToilet"
                                            value={inputs.postToilet} onChange={handleInputChange} 
                                            className="w-full bg-black/40 border border-slate-700 rounded-lg p-2 text-sm text-center text-white outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder-slate-700 font-mono"
                                        />
                                    </div>
                                </div>

                                {/* Live Preview */}
                                {inputs.wake && inputs.postFood && inputs.postToilet && (
                                    <div className="bg-gradient-to-r from-rose-900/20 to-purple-900/20 border border-rose-500/20 p-3 rounded-lg text-sm text-slate-300 flex justify-between items-center animate-in fade-in zoom-in duration-300">
                                        <span>
                                            排泄: <span className="font-bold text-rose-300 font-mono">{(inputs.postFood - inputs.postToilet).toFixed(2)}</span>
                                        </span>
                                        <span className="text-rose-400 font-bold border-l border-white/10 pl-3 font-mono">
                                            净重: {(inputs.wake - (inputs.postFood - inputs.postToilet)).toFixed(2)} kg
                                        </span>
                                    </div>
                                )}

                                <button 
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-rose-600 to-purple-600 hover:from-rose-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-purple-900/20 flex justify-center items-center gap-2 active:scale-[0.98]"
                                >
                                    保存体重数据
                                </button>
                            </form>
                        </section>

                        {/* Charts */}
                        {records.length > 1 && (
                            <section className="glass-panel p-5 rounded-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-semibold flex items-center gap-2 text-white">
                                        <IconTrendingDown className="w-5 h-5 text-purple-400" />
                                        趋势分析
                                    </h2>
                                </div>
                                <ChartView data={chartData} chartView={chartView} />
                            </section>
                        )}

                        {/* History List */}
                        <section className="glass-panel p-5 rounded-2xl">
                            <h2 className="text-lg font-semibold mb-4 flex items-center gap-2 text-white">
                                <IconCalendar className="w-5 h-5 text-rose-500" />
                                体重历史
                            </h2>
                            <div className="space-y-3">
                                {[...records].sort((a, b) => new Date(b.date) - new Date(a.date)).map(record => (
                                    <div key={record.id} className="group flex justify-between items-center p-3 hover:bg-white/5 rounded-xl border border-transparent hover:border-white/5 transition-all">
                                        <div>
                                            <div className="font-bold text-slate-200 font-mono">{record.date}</div>
                                            <div className="text-xs text-slate-500 mt-1 flex gap-2 font-mono">
                                                <span>起:{record.wake}</span>
                                                <span>食:{record.postFood}</span>
                                                <span>厕:{record.postToilet}</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <div className="text-right">
                                                <div className="text-lg font-bold text-rose-400 font-mono">{record.net} <span className="text-xs opacity-60">kg</span></div>
                                            </div>
                                            <button onClick={() => handleDeleteRecord(record.id)} className="p-2 text-slate-600 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-all opacity-0 group-hover:opacity-100">
                                                <IconTrash2 className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
